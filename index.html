<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>億鑫引薦島</title>
<meta name="description" content="BNI 億鑫分會 20 位夥伴的 3D 引薦島：一座島一個產業席位，看誰和誰一起做生意。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<meta property="og:type" content="website">
<meta property="og:title" content="億鑫引薦島｜BNI 億鑫分會">
<meta property="og:description" content="BNI 億鑫分會 20 位夥伴的 3D 引薦島：一座島一個產業席位，看誰和誰一起做生意。">
<meta property="og:url" content="https://marcuskuo-max.github.io/yixin-referral-island/">
<meta property="og:image" content="https://marcuskuo-max.github.io/yixin-referral-island/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#C8102E">
<style>
/* Layout: full-screen 3D island; UI floats as glass cards — brand top-left, tools top-right, detail panel right (desktop) / bottom sheet (phone). */
:root{
  --ink:#14202E; --muted:#5A6777; --line:#DFE4EA; --panel:#FFFFFF; --panel-2:#F4F6F9; --glass:rgba(255,255,255,.9);
  --accent:#C8102E; --accent-ink:#FFFFFF; --gold:#A87A1E; --live:#E0263F; --bg:#BFE3F2;
  --shadow:0 12px 32px rgba(18,30,46,.16); --shadow-s:0 4px 14px rgba(18,30,46,.14);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#EDF1F6; --muted:#9BA8B8; --line:#2B3646; --panel:#151C27; --panel-2:#1C2532; --glass:rgba(21,28,39,.9);
  --accent:#FF4D63; --accent-ink:#FFFFFF; --gold:#E2B456; --live:#FF5168; --bg:#0F2230;
  --shadow:0 12px 32px rgba(0,0,0,.45); --shadow-s:0 4px 14px rgba(0,0,0,.4); color-scheme:dark; } }
:root[data-theme="dark"]{
  --ink:#EDF1F6; --muted:#9BA8B8; --line:#2B3646; --panel:#151C27; --panel-2:#1C2532; --glass:rgba(21,28,39,.9);
  --accent:#FF4D63; --accent-ink:#FFFFFF; --gold:#E2B456; --live:#FF5168; --bg:#0F2230;
  --shadow:0 12px 32px rgba(0,0,0,.45); --shadow-s:0 4px 14px rgba(0,0,0,.4); color-scheme:dark; }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#ui{position:absolute;inset:0;pointer-events:none;z-index:2}
#ui > *{pointer-events:auto}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow-s)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* brand */
.brand{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border-radius:var(--r);max-width:calc(100vw - 150px)}
.brand .logo{width:74px;height:44px;border-radius:9px;object-fit:cover;object-position:52% 50%;flex:none}
.brand-txt{min-width:0;display:grid;gap:2px}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:23px;line-height:1.1;letter-spacing:.04em;text-wrap:balance}
.clock{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;cursor:pointer;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.clock .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.clock.live .dot{background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 1.6s infinite}
.clock.live #clockTag{color:var(--live);font-weight:700}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}

/* tools */
.tools{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;width:112px}
.tools button{display:flex;align-items:center;gap:8px;justify-content:flex-start;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow-s);cursor:pointer;font-size:13.5px;font-weight:700;white-space:nowrap}
.tools button svg{width:16px;height:16px;flex:none}
.tools button:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.tools button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tools button[aria-pressed="true"]:not(.primary){background:var(--ink);color:var(--panel);border-color:var(--ink)}
.timepop{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(136px + env(safe-area-inset-right,0px));width:250px;padding:14px;border-radius:var(--r);display:grid;gap:10px}
.timepop h3{margin:0;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-weight:500;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip small{font-family:var(--f-mono);font-size:10.5px;opacity:.7;margin-left:4px}

/* stats strip */
.stats{position:absolute;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:2px;border-radius:999px;padding:5px;font-size:12.5px;white-space:nowrap}
.stats span{padding:5px 12px;border-radius:999px}
.stats b{font-family:var(--f-mono);font-size:13.5px;margin-right:4px;font-variant-numeric:tabular-nums}
.stats .hot{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}

/* legend */
.legend{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,auto);gap:4px 12px;padding:10px 12px;border-radius:12px;font-size:11.5px}
.legend button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0;cursor:pointer;font-size:11.5px;text-align:left}
.sw{width:10px;height:10px;border-radius:3px;flex:none}

/* log */
.log{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:320px;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;max-height:min(32vh,250px)}
.log[data-min="true"] .log-b{display:none}
.log-min{border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;width:26px;height:26px;border-radius:7px}
.log-min:hover{background:var(--panel-2)}
.log-h{display:flex;align-items:center;gap:4px;padding:8px 8px 0 12px}
.log-h .eyebrow{margin-right:auto}
.tab{border:0;background:none;padding:6px 9px;border-radius:8px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:700}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--ink)}
.log-b{overflow:auto;padding:8px 12px 12px;font-size:12.5px;line-height:1.55}
.log-row{display:grid;grid-template-columns:42px 1fr;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line)}
.log-row:last-child{border-bottom:0}
.log-row time{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin:8px 0 0}
.livepill{font-family:var(--f-mono);font-size:10px;color:var(--live);font-weight:700;letter-spacing:.08em}

/* pins */
.pin{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:auto;cursor:pointer;border:0;background:none;padding:0;will-change:transform;transition:opacity .2s}
.pin .av{width:36px;height:36px;border-radius:50%;border:3px solid var(--c,#999);background:#fff;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.25);display:grid;place-items:center}
.pin .av img{width:100%;height:100%;object-fit:cover;display:block}
.pin .nm{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);color:#14202E;border-radius:999px;padding:2px 8px 2px 7px;font-size:11.5px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);line-height:1.35}
.pin .nm i{font-style:normal;font-weight:500;color:#5A6777;font-size:10.5px}
.pin .nm .no{font-family:var(--f-mono);font-size:9.5px;color:var(--c);font-weight:700}
.pin::after{content:"";width:2px;height:10px;background:rgba(255,255,255,.85);margin-top:-1px}
.pin.sel .av{transform:scale(1.18);box-shadow:0 0 0 4px rgba(255,255,255,.9),0 6px 16px rgba(0,0,0,.3)}
.pin.dim{opacity:.35}
#pins.far .pin .nm i{display:none}
#pins.vfar .pin .nm{display:none}
#pins.vfar .pin .av{width:28px;height:28px;border-width:2px}
#pins.off .pin:not(.guest){display:none}
.pin.seat .av{border-style:dashed;background:#FFF7E8;color:#C8102E;font-weight:900;font-size:18px}
.pin.seat .nm{background:#C8102E;color:#fff}
.pin.seat .nm i{color:#FFE1E5}
.pin.hub .av{width:44px;height:44px;border-color:#C8102E;background:#C8102E}
.pin.hub .av img{object-fit:cover;object-position:46% 50%;transform:scale(1.9)}
.pin.hub .nm{background:#14202E;color:#fff}
.pin.hub .nm i{color:#C9D3DF}
.pin.guest .av{border-color:#1F8A5B;background:#E7F6EE;color:#1F8A5B;font-weight:900}
.pin.guest .nm{background:#1F8A5B;color:#fff}
.tag3d{position:absolute;left:0;top:0;pointer-events:none;background:#14202E;color:#fff;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.3)}

/* panel */
.panel{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(136px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:400px;border-radius:18px;background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.panel .grab{display:none}
.panel .x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;line-height:1;z-index:2}
.pbody{overflow:auto;padding:22px 22px 26px;display:grid;gap:16px;align-content:start;overscroll-behavior:contain}
.phead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding-right:36px}
.phead .ph{width:72px;height:72px;border-radius:50%;border:3px solid var(--c);object-fit:cover;background:var(--panel-2)}
.phead .ph.box{display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:26px;color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.phead h2{margin:2px 0 0;font-family:var(--f-display);font-size:26px;font-weight:900;line-height:1.15;letter-spacing:.02em}
.phead .ind{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.ey-c{color:var(--c)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--panel-2);border:1px solid var(--line)}
.badge.role{background:color-mix(in srgb,var(--c) 12%,var(--panel));border-color:color-mix(in srgb,var(--c) 35%,var(--line));color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.badge.gold{background:color-mix(in srgb,var(--gold) 15%,var(--panel));border-color:color-mix(in srgb,var(--gold) 45%,var(--line));color:var(--gold)}
.slogan{margin:0;padding:10px 14px;border-left:3px solid var(--c);background:var(--panel-2);border-radius:0 10px 10px 0;font-size:14px;line-height:1.6;font-weight:500}
.iam{display:grid;gap:10px}
.iam section{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.iam h4{margin:0;font-size:12px;font-weight:900;color:#fff;background:var(--c);border-radius:8px;text-align:center;padding:4px 0;letter-spacing:.1em}
.iam ul{margin:0;padding:0 0 0 1.1em;font-size:13.5px;line-height:1.6;display:grid;gap:3px}
.iam p{margin:0;font-size:13.5px;line-height:1.6;font-weight:700}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 -6px}
.sec-t h3{margin:0;font-size:14px;font-weight:900}
.sec-t span{font-size:11.5px;color:var(--muted)}
.rlist{display:grid;gap:8px}
.ritem{display:grid;grid-template-columns:auto 34px 1fr;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;width:100%}
.ritem:hover{background:var(--panel-2)}
.ritem .dir{font-family:var(--f-mono);font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 6px;white-space:nowrap}
.dir.out{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.dir.in{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.ritem img,.ritem .mini{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--c);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--c);background:var(--panel-2)}
.ritem b{display:block;font-size:13.5px}
.ritem small{display:block;font-size:12px;color:var(--muted);line-height:1.45;margin-top:1px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.c3{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:4px;min-width:0}
.c3 span{font-size:11px;color:var(--muted)}
.c3 b{font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.status{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#1F8A5B 12%,var(--panel));font-size:13px;font-weight:700}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#1F8A5B}
.para{margin:0;font-size:14px;line-height:1.7}
.foot{font-size:11.5px;color:var(--muted);line-height:1.6;margin:0;padding-top:10px;border-top:1px solid var(--line)}
.cta{border-radius:14px;padding:14px;background:color-mix(in srgb,var(--accent) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));display:grid;gap:8px}
.cta b{font-size:15px}
.cta p{margin:0;font-size:13px;line-height:1.6}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyrow code{font-family:var(--f-mono);font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;user-select:all;overflow-wrap:anywhere}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.field{display:grid;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:700}
.field input{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);min-width:0;width:100%}
.row{display:flex;gap:8px}
.row > input{flex:1}
.ltabs{display:flex;gap:4px;background:var(--panel-2);padding:4px;border-radius:12px}
.ltabs .tab{flex:1;padding:8px 4px}
.ltabs .tab[aria-selected="true"]{background:var(--panel);box-shadow:var(--shadow-s)}
.lgroup h4{margin:6px 0 6px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.agenda{display:grid;gap:0;font-size:13px}
.agenda div{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.agenda time{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.big div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.big b{font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big span{font-size:11.5px;color:var(--muted)}
.wanted{display:flex;flex-wrap:wrap;gap:6px}
.wanted span{font-size:12px;border:1px dashed color-mix(in srgb,var(--c) 60%,var(--line));color:color-mix(in srgb,var(--c) 75%,var(--ink));border-radius:8px;padding:3px 8px}

/* tour bar */
.tourbar{z-index:5;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100vw - 32px));border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.tourbar time{font-family:var(--f-mono);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.tourbar .tt{min-width:0}
.tourbar .tt b{display:block;font-size:14.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tourbar .tt small{display:block;font-size:12px;color:var(--muted);line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tourbar .prog{grid-column:1/-1;height:4px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.tourbar .prog i{display:block;height:100%;background:var(--accent);width:0}
.tourbar .ctl{display:flex;gap:6px}
.tourbar .ctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center}
.tourbar .ctl button svg{width:15px;height:15px}
.tourbar .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* intro */
.intro{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,18,28,.38);padding:16px}
.intro .card{width:min(460px,100%);background:var(--panel);border-radius:20px;padding:26px;box-shadow:var(--shadow);display:grid;gap:12px}
.intro h2{margin:0;font-family:var(--f-display);font-size:26px;font-weight:900;line-height:1.25;text-wrap:balance}
.intro p{margin:0;font-size:14.5px;line-height:1.75;color:var(--muted)}
.intro .ey{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700}
.intro .acts{display:flex;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:18px;border-radius:4px}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink);transition:opacity .5s}
#ui > .loading.done{opacity:0;pointer-events:none}
.fallback{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));padding:20px;border-radius:16px;text-align:center;line-height:1.7}
.mobile-only{display:none}

@media (max-width: 1099px){ .stats{display:none} }
body.panel-open .legend{display:none}

@media (max-width: 899px){
  .stats{display:none}
  .legend{display:none}
  .panel{left:0;right:0;bottom:0;top:auto;width:auto;max-height:62vh;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}

  .log[data-collapsed="true"]{display:none}
  .mobile-only{display:flex}
  .tourbar{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  body.sheet .tourbar{bottom:calc(62vh + 10px)}
}
@media (max-width: 560px){
  .brand{padding:6px 10px 6px 6px;gap:8px;max-width:calc(100vw - 128px)}
  .brand .logo{width:52px;height:34px}
  .brand h1{font-size:18px}
  .brand .eyebrow{display:none}
  .tools{width:auto;gap:6px;align-items:flex-end}
  .tools button{width:40px;height:40px;padding:0;justify-content:center}
  .tools button .lb{display:none}
  .tools button.primary{width:auto;padding:0 12px}
  .tools button.primary .lb{display:inline;font-size:12.5px}
  .timepop{right:calc(14px + env(safe-area-inset-right,0px));top:calc(60px + env(safe-area-inset-top,0px));width:min(260px,calc(100vw - 28px))}
  .phead .ph{width:58px;height:58px}
  .phead h2{font-size:22px}
  .tourbar{grid-template-columns:1fr auto;padding:10px 12px}
  .tourbar time{grid-column:1/-1;font-size:16px;margin-bottom:-6px}
  .cards3{grid-template-columns:1fr}
}

const islandGroups = {};
function makeIsland(pos, {ground, cliff='#C49B74', rim='#A86F4D', scale=1, kind, id}) {
  const g = new THREE.Group(); g.position.copy(pos); g.scale.setScalar(scale); scene.add(g);
  const base = new THREE.Mesh(BASEG, mat(cliff)); base.receiveShadow = true; g.add(base);
  const rm = new THREE.Mesh(RIMG, mat(rim)); rm.position.y = .46; g.add(rm);
  const top = new THREE.Mesh(TOPG, mat(ground)); top.position.y = .53; top.receiveShadow = true; g.add(top);
  top.userData = {kind, id}; pickables.push(top); base.userData = {kind, id}; pickables.push(base);
  return g;
}

/* merge static meshes by material to keep draw calls low */
function bakeStatic(exclude) {
  scene.updateMatrixWorld(true);
  const buckets = new Map(), victims = [];
  scene.traverse(o => {
    if (!o.isMesh || o.userData.kind || !o.material || o.material.map || o.material.transparent) return;
    for (let a = o; a; a = a.parent) if (exclude.has(a)) return;
    const key = o.material.uuid + (o.castShadow ? 'c' : '') + (o.receiveShadow ? 'r' : '');
    const g = (o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone());
    for (const k of Object.keys(g.attributes)) if (!['position','normal','uv'].includes(k)) g.deleteAttribute(k);
    g.clearGroups(); g.applyMatrix4(o.matrixWorld);
    if (!buckets.has(key)) buckets.set(key, {mat:o.material, cs:o.castShadow, rs:o.receiveShadow, geos:[]});
    buckets.get(key).geos.push(g); victims.push(o);
  });
  victims.forEach(o => o.parent.remove(o));
  buckets.forEach(b => { const merged = mergeGeometries(b.geos, false); if (!merged) return; const m = new THREE.Mesh(merged, b.mat); m.castShadow = b.cs; m.receiveShadow = b.rs; m.matrixAutoUpdate = false; scene.add(m); b.geos.forEach(g => g.dispose()); });
  return victims.length;
}

/* graph + routes */
const NODES = [{id:'hub', hex:[0,0]}, ...MEMBERS.map(m => ({id:m.id, hex:m.hex}))];
const ADJ = {}; NODES.forEach(a => ADJ[a.id] = NODES.filter(b => b !== a && hexDist(a.hex, b.hex) === 1).map(b => b.id));
function bfs(s, t) { const prev = {[s]:null}; const q = [s]; while (q.length) { const u = q.shift(); if (u === t) break; for (const v of ADJ[u]) if (!(v in prev)) { prev[v] = u; q.push(v); } } const path = []; for (let u = t; u != null; u = prev[u]) path.unshift(u); return path; }

function buildWalkers() {
  const bridged = new Set();
  const addBridge = (a,b) => { const k = [a,b].sort().join('~'); if (!bridged.has(k)) { bridged.add(k); bridge(a,b); } };
  ADJ.hub.forEach(v => addBridge('hub', v));
  ROUTES.forEach((rt, i) => {
    const path = bfs(rt.from, rt.to); rt.path = path;
    for (let j=0;j<path.length-1;j++) addBridge(path[j], path[j+1]);
    const off = ((i%5)-2)*.035;
    const pts = [];
    path.forEach((id, j) => {
      const c = islandPos[id].clone();
      if (j > 0) { const prev = islandPos[path[j-1]]; pts.push(prev.clone().add(c).multiplyScalar(.5)); }
      pts.push(c);
    });
    // lateral offset
    const P = pts.map((p, j) => { const a = pts[Math.max(0,j-1)], b = pts[Math.min(pts.length-1,j+1)]; const d = b.clone().sub(a); const n = new THREE.Vector3(-d.z, 0, d.x).normalize().multiplyScalar(off); return p.clone().add(n).setY(TOP); });
    const L = [0]; for (let j=1;j<P.length;j++) L.push(L[j-1] + P[j].distanceTo(P[j-1]));
    const body = person(shirtCols[i % shirtCols.length], i%3===0 ? '#3D3A4B' : '#2E3A4F', ['#F1C7A5','#E3B08C','#F5D3B8'][i%3], ['#2B2420','#4A3426','#1E1B18'][i%3]);
    const item = box(body, rt.ic, .055, .045, .05, 0, .2, 0, {cs:false});

    hit.position.y = .12; body.add(hit); hit.userData = {kind:'walker', id:i}; pickables.push(hit);
    scene.add(body);
    walkers.push({rt, body, item, P, L, total:L[L.length-1], s:Math.random()*L[L.length-1], dir:1, wait:0, speed:.32 + (i%4)*.03, idx:i});
  });
}
function walkerPos(w) {
  const s = w.dir > 0 ? w.s : w.total - w.s; let j = 1; while (j < w.L.length-1 && w.L[j] < s) j++;
  const a = w.P[j-1], b = w.P[j]; const t = (s - w.L[j-1]) / Math.max(1e-6, w.L[j]-w.L[j-1]);
  return {p: a.clone().lerp(b, Math.min(1, Math.max(0, t))), d: b.clone().sub(a).multiplyScalar(w.dir > 0 ? 1 : -1) , rev: w.dir < 0};
}

}

/* =========================== CAMERA / FLY =========================== */
const HOME_T = new THREE.Vector3(0, 0, .4);
const HOME_DIR = new THREE.Vector3(.2, .74, .64).normalize();
function homeDist() { const a = innerWidth / innerHeight; let d = 20.5; if (a < 1) d = 20.5 / Math.pow(a, .82); if (a > 1.9) d = 19; return Math.min(d, 46); }
let fly = null;
function flyTo(target, dist, dir) {
  const d = dir ? dir.clone().normalize() : camera.position.clone().sub(controls.target).normalize();
  if (d.y < .45) { d.y = .45; d.normalize(); }
  const endPos = target.clone().add(d.multiplyScalar(dist));
  if (reduceMotion) { controls.target.copy(target); camera.position.copy(endPos); controls.update(); return; }
  fly = {t0:performance.now(), dur:950, p0:camera.position.clone(), q0:controls.target.clone(), p1:endPos, q1:target.clone()};
}
const goHome = () => flyTo(HOME_T, homeDist(), HOME_DIR);
let viewOffset = {x:0, y:0};
function applyViewOffset() {
  const W = innerWidth, H = innerHeight; const open = !$('#panel').hidden;
  let ox = 0, oy = 0;
  if (open) { if (isNarrow()) oy = Math.round($('#panel').getBoundingClientRect().height * .45); else ox = Math.round((400 + 136) / 2); }
  viewOffset = {x:ox, y:oy};
  if (ox || oy) camera.setViewOffset(W, H, ox, oy, W, H); else camera.clearViewOffset();
  document.body.classList.toggle('sheet', open && isNarrow()); document.body.classList.toggle('panel-open', open);
}

/* =========================== PANELS =========================== */
const panel = $('#panel'), pbody = $('#pbody');
let current = null; // {kind,id}
function openPanel(html, sel) {
  pbody.innerHTML = html; panel.hidden = false; pbody.scrollTop = 0; current = sel;
  bindPanel(); applyViewOffset();
  document.querySelectorAll('.tools [data-act="list"],.tools [data-act="seat"]').forEach(b => b.setAttribute('aria-pressed', String((sel?.kind === 'list' && b.dataset.act === 'list') || (sel?.kind === 'guest' && b.dataset.act === 'seat'))));
}
function closePanel() {
  panel.hidden = true; current = null; clearSelection(); applyViewOffset();
  document.querySelectorAll('.tools [data-act="list"],.tools [data-act="seat"]').forEach(b => b.setAttribute('aria-pressed','false'));
}
function bindPanel() {
  pbody.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { const [k,i] = b.dataset.go.split(':'); select(k, i); }));
  pbody.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
    const txt = b.dataset.copy; try { await navigator.clipboard.writeText(txt); b.textContent = '已複製'; } catch (e) { const code = b.parentElement.querySelector('code'); if (code) { const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } b.textContent = '已選取，請按複製'; }
  }));
  pbody.querySelectorAll('[data-tour]').forEach(b => b.addEventListener('click', () => startTour(+b.dataset.tour || 0)));
}
const routesOf = id => ROUTES.filter(r => r.from === id || r.to === id);
const chainTag = c => `<span class="eyebrow ey-c" style="--c:${CHAINS[c].color}">${c}・${esc(CHAINS[c].name)}</span>`;
function memberHTML(m, present=false) {
  const rs = routesOf(m.id);

function chainHTML(c) {
  const ch = CHAINS[c]; const ms = MEMBERS.filter(m => m.chain === c); const seats = SEATS.filter(s => s.chain === c);
  return `<div style="--c:${ch.color};display:grid;gap:16px">
    <div class="phead"><span class="ph box">${c}</span><div><span class="eyebrow ey-c">產業鏈・${ms.length} 位會員</span><h2>${esc(ch.name)}</h2></div></div>
    <div class="rlist">${ms.map(o => `<button class="ritem" type="button" data-go="member:${o.id}" style="--c:${ch.color}"><span class="dir in">${esc(o.short)}</span>${avatarHTML(o.id)}<span><b>${esc(o.name)}</b><small>${esc(o.iam)}</small></span></button>`).join('')}
      ${seats.map(s => `<button class="ritem" type="button" data-go="seat:${s.id}" style="--c:#C8102E"><span class="dir out">急徵</span><span class="mini">＋</span><span><b>${esc(s.name)}</b><small>${esc(s.why)}</small></span></button>`).join('')}</div>
    ${RECRUIT[c] ? `<div><div class="sec-t" style="margin-bottom:8px"><h3>這條鏈還在誠徵</h3></div><div class="wanted">${RECRUIT[c].split('・').map(x => `<span>${esc(x)}</span>`).join('')}</div></div>` : ''}
    <p class="foot">產業鏈分組取自 2026/10/23 例會簡報「八大產業鏈｜現有會員總覽」與「億鑫分會產業鏈藍圖」。</p></div>`;
}
let listTab = 'members', listQ = '';
function listHTML() {
  const q = listQ.trim();
  const hit = s => !q || s.includes(q);
  let body = '';
  if (listTab === 'members') {
    body = Object.keys(CHAINS).map(c => { const ms = MEMBERS.filter(m => m.chain === c && hit(m.name + m.ind + m.iam + m.iwant.join() + m.ihave.join())); if (!ms.length) return '';
      return `<div class="lgroup"><h4><span class="sw" style="background:${CHAINS[c].color}"></span>${c}・${esc(CHAINS[c].name)}</h4><div class="rlist">${ms.map(o => `<button class="ritem" type="button" data-go="member:${o.id}" style="--c:${CHAINS[c].color}"><span class="dir in">${String(o.no).padStart(2,'0')}</span>${avatarHTML(o.id)}<span><b>${esc(o.name)}・${esc(o.short)}</b><small>${esc(o.iam)}</small></span></button>`).join('')}</div></div>`; }).join('');
  } else if (listTab === 'chains') {
    body = `<div class="rlist">${Object.entries(CHAINS).filter(([c,ch]) => hit(ch.name)).map(([c,ch]) => { const n = MEMBERS.filter(m => m.chain === c).length; return `<button class="ritem" type="button" data-go="chain:${c}" style="--c:${ch.color}"><span class="dir in">${c}</span><span class="mini">${n}</span><span><b>${esc(ch.name)}</b><small>${MEMBERS.filter(m => m.chain === c).map(m => m.name).join('・')}</small></span></button>`; }).join('')}</div>`;
  } else if (listTab === 'routes') {
    body = `<div class="rlist">${walkers.length ? walkers.filter(w => hit(w.rt.who + w.rt.item + w.rt.story + M[w.rt.from].name + M[w.rt.to].name)).map(w => { const r = w.rt, t = M[r.to];
      return `<button class="ritem" type="button" data-go="walker:${w.idx}" style="--c:${CHAINS[t.chain].color}"><span class="dir out">${r.no}</span>${avatarHTML(r.to)}<span><b>${esc(M[r.from].name)} → ${esc(t.name)}</b><small>${esc(r.who)}帶著「${esc(r.item)}」：${esc(r.story)}</small></span></button>`; }).join('') : ROUTES.map(r => `<div class="ritem"><span class="dir out">${r.no}</span><span class="mini">→</span><span><b>${esc(M[r.from].name)} → ${esc(M[r.to].name)}</b><small>${esc(r.story)}</small></span></div>`).join('')}</div>`;
  } else {
    body = `<div class="rlist">${SEATS.filter(s => hit(s.name + s.why)).map(s => `<button class="ritem" type="button" data-go="seat:${s.id}" style="--c:#C8102E"><span class="dir out">急徵</span><span class="mini">＋</span><span><b>${esc(s.name)}</b><small>${esc(CHAINS[s.chain].name)}｜${esc(s.why)}</small></span></button>`).join('')}</div>`;
  }
  const tabs = [['members','夥伴 20'],['chains','產業鏈 8'],['routes',`路徑 ${ROUTES.length}`],['seats','急徵 8']];
  return `<div style="display:grid;gap:14px">
    <div><span class="eyebrow">THE YIXIN INDEX</span><h2 style="margin:4px 0 0;font-family:var(--f-display);font-size:24px;font-weight:900">億鑫島清單</h2></div>
    <div class="field"><input id="listQ" type="search" placeholder="搜尋夥伴、產業、需求…" value="${esc(listQ)}" aria-label="搜尋"></div>
    <div class="ltabs" role="tablist">${tabs.map(([k,l]) => `<button class="tab" role="tab" data-lt="${k}" aria-selected="${listTab===k}">${l}</button>`).join('')}</div>
    <div id="listBody">${body || '<p class="note">找不到符合的項目。</p>'}</div></div>`;
}

  // clock
  if (tour) { if (tour.playing) { tour.t += dt; const st = STEPS[tour.i]; const dur = st.kind === 'member' ? 5.5 : 4.2; if (tour.t > dur) { if (tour.i < STEPS.length-1) setTourStep(tour.i+1); else { tour.playing = false; setTourStep(tour.i); } } } }
  else if (clockRun) { simMin = (simMin + dt*SPEED) % 1440; if (frame % 15 === 0) renderClock(); }
  if (Math.abs(simMin - lastLight) > .4) { applyTime(simMin/60); lastLight = simMin; }
  // fly
  if (fly) { const k = Math.min(1, (performance.now() - fly.t0)/fly.dur); const e = k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k+2, 3)/2;
    camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.q0, fly.q1, e); if (k >= 1) fly = null; }
  controls.update();
  // anim
  const ws = reduceMotion ? .4 : 1;
  spinners.forEach(s => { s.o.rotation.y += dt * s.s * ws; });
  wavers.forEach((w, i) => { w.rotation.y = Math.sin(t*3 + i) * .35; });
  steamers.forEach(s => { const k = ((t*.5 + s.ph) % 1); s.o.position.set(s.x + Math.sin(k*6)*.02, TOP + .1 + k*.32, s.z); s.o.scale.setScalar(.04 + k*.06); s.o.material.opacity = .8*(1-k); });
  blinkers.forEach((b, i) => { b.visible = Math.sin(t*4 + i) > -.2; });
  boats.forEach(b => { const a = b.ph + t*b.sp; b.g.position.set(Math.cos(a)*b.r, .02 + Math.sin(t*2+b.ph)*.015, Math.sin(a)*b.r); b.g.rotation.y = -a - (b.sp > 0 ? Math.PI/2 : -Math.PI/2); });
  clouds.forEach((c, i) => { c.position.x += dt*.25*(1 + (i%3)*.3); if (c.position.x > 30) c.position.x = -30; });
  if (frame % 2 === 0) { sparkles.userData.items.forEach((it, i) => { const s = .4 + .6*Math.max(0, Math.sin(t*it.sp + it.ph)); dObj.position.set(it.p.x, .012, it.p.z); dObj.rotation.set(-Math.PI/2, 0, it.ph); dObj.scale.set(s, 1, 1); dObj.updateMatrix(); sparkles.setMatrixAt(i, dObj.matrix); }); sparkles.instanceMatrix.needsUpdate = true; }
  // walkers
  walkers.forEach(w => {
    if (w.wait > 0) { w.wait -= dt; } else {
      w.s += dt * w.speed * ws;
      if (w.s >= w.total) { w.s = 0; pushFeed(w); w.dir *= -1; w.wait = 1.4; w.item.material = mat(w.dir > 0 ? w.rt.ic : '#E8B64C'); w.item.scale.set(w.dir > 0 ? .055 : .05, w.dir > 0 ? .045 : .035, w.dir > 0 ? .05 : .012); }
    }
    const {p, d} = walkerPos(w); w.body.position.copy(p); if (d.lengthSq() > 1e-6) w.body.rotation.y = Math.atan2(d.x, d.z);
    const moving = w.wait <= 0; const sw = moving ? Math.sin(t*10 + w.idx) * .5 : 0;
    w.body.userData.legs[0].rotation.x = sw; w.body.userData.legs[1].rotation.x = -sw; w.body.position.y = TOP + (moving ? Math.abs(Math.sin(t*10 + w.idx))*.012 : 0);
  });
  // arcs
  arcDots.forEach(a => { a.t = (a.t + dt*.35) % 1; a.dot.position.copy(a.c.getPoint(a.t)); });
  // ring pulse
  if (selRing?.visible) selRing.position.y = selRing.userData.y0 + Math.sin(t*3)*.02;
  // beams
  const live = isLive(simMin); beamGroup.visible = live;
  if (live) beamGroup.children.forEach((o, i) => { if (o.geometry.type === 'TorusGeometry') { const k = (t*.45 + o.userData.ph) % 1; o.scale.setScalar(1 + k*6); o.material.opacity = .6*(1-k); } else o.material.opacity = .25 + .3*(.5+.5*Math.sin(t*2 + i)); });
  if (screenMat) screenMat.emissiveIntensity = (live ? .9 : .35) + (lampMat.emissiveIntensity*.2);
  // walker status in panel
  if (current?.kind === 'walker' && frame % 20 === 0) { const w = walkers[current.id]; const el = $('#walkStatus'); if (el) el.textContent = w.wait > 0 ? `剛抵達 ${M[w.dir > 0 ? w.rt.from : w.rt.to].name}，準備出發` : `正在前往 ${M[w.dir > 0 ? w.rt.to : w.rt.from].name}`; }
  renderer.render(scene, camera);
  // pins
  const W = innerWidth, H = innerHeight; const dist = camera.position.distanceTo(controls.target);
  pinsEl.classList.toggle('far', dist > (W < 600 ? 13 : 17)); pinsEl.classList.toggle('vfar', dist > (W < 600 ? 22 : 30));
  pins.forEach(p => {
    vv.copy(p.anchor).project(camera);
    if (vv.z > 1 || vv.x < -1.15 || vv.x > 1.15 || vv.y < -1.15 || vv.y > 1.2) { p.el.style.visibility = 'hidden'; return; }
    const x = (vv.x*.5+.5)*W, y = (-vv.y*.5+.5)*H;
    p.el.style.visibility = ''; p.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)`; p.el.style.zIndex = String(1000 - Math.round(vv.z*900));
  });
  if (selWalker >= 0) { const w = walkers[selWalker]; vv.copy(w.body.position).setY(TOP+.34).project(camera); tagEl.hidden = false;
    tagEl.textContent = w.dir > 0 ? `${w.rt.who}・${w.rt.item}` : '回程・感謝卡'; tagEl.style.transform = `translate(${((vv.x*.5+.5)*W).toFixed(1)}px,${((-vv.y*.5+.5)*H).toFixed(1)}px) translate(-50%,-100%)`; }
}
init();
</script>
</body>
